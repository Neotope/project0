<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Project 0 项目入口。">
  <title>Project 0</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      color: #f4f4f5;
      background: #101114;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #252733 0, #101114 58%);
    }
    main { width: min(100%, 680px); }
    .label { margin: 0 0 12px; color: #a1a1aa; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 4rem); letter-spacing: -.06em; }
    .intro { margin: 10px 0 32px; color: #a1a1aa; line-height: 1.6; }
    nav { display: grid; gap: 10px; }
    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border: 1px solid #34363f;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      background: #191a20;
      transition: border-color .18s ease, transform .18s ease, background .18s ease;
    }
    a:hover, a:focus-visible { transform: translateY(-2px); border-color: #8b8cf7; background: #20212a; outline: none; }
    a strong { font-size: 1rem; }
    a span { color: #a1a1aa; font-size: .9rem; }
    .arrow { color: #a5b4fc; font-size: 1.2rem; }
    footer { margin-top: 24px; color: #71717a; font-size: .8rem; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <p class="label">Neotope · Project 0</p>
    <h1>项目入口</h1>
    <p class="intro">选择一个项目开始体验。</p>
    <nav aria-label="项目页面">
      <a href="./gun_evolution_shooter.html">
        <div><strong>枪械进化</strong><br><span>在战斗中升级武器，迎战怪物。</span></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a href="./code_artifact.html">
        <div><strong>火力防线</strong><br><span>部署炮塔，守住防线。</span></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a href="./v2.html">
        <div><strong>火力防线 · 无限模式</strong><br><span>体验持续升级的塔防挑战。</span></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
    <footer>Neotope / project0</footer>
  </main>
</body>
</html>
